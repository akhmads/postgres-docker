# Aturan dibaca dari atas ke bawah; yang pertama cocok yang dipakai.
# TYPE      DATABASE  USER   ADDRESS       METHOD

# Socket lokal di dalam container (healthcheck, init script, docker exec)
local       all       all                  trust

# Loopback di dalam container
host        all       all    127.0.0.1/32  scram-sha-256
host        all       all    ::1/128       scram-sha-256

# Tolak semua koneksi jaringan TANPA SSL
hostnossl   all       all    all           reject

# --- Opsional: superuser hanya dari IP tertentu (hapus '#' & sesuaikan) ---
# hostssl   all       admin  203.0.113.10/32  scram-sha-256
# hostssl   all       admin  all              reject

# --- Batasi IP klien di sini. 0.0.0.0/0 = semua IP (publik) ---
# Contoh hanya LAN: ganti 0.0.0.0/0 dengan 10.68.68.0/24
hostssl     all       all    0.0.0.0/0     scram-sha-256
hostssl     all       all    ::/0          scram-sha-256
