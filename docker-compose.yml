services:
  postgres:
    image: postgres:${POSTGRES_VERSION:-18}
    container_name: ${CONTAINER_NAME:-postgres18}
    restart: unless-stopped
    shm_size: ${PG_SHM_SIZE:-256mb}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER wajib diisi di .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD wajib diisi di .env}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
      APP_USER: ${APP_USER:?APP_USER wajib diisi di .env}
      APP_PASSWORD: ${APP_PASSWORD:?APP_PASSWORD wajib diisi di .env}
      SSL_CN: ${SSL_CN:-localhost}
      TZ: ${TZ:-UTC}
      PGTZ: ${TZ:-UTC}
    ports:
      # 0.0.0.0 -> terbuka di semua interface host
      - "${POSTGRES_BIND_ADDRESS:-0.0.0.0}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # PostgreSQL 18+: mount di /var/lib/postgresql (bukan .../data)
      - pgdata:/var/lib/postgresql
      - ./config/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      - ./initdb:/docker-entrypoint-initdb.d:ro
      # Tuning (pgtune dll): semua file *.conf di folder ini dibaca otomatis
      - ./config/conf.d:/etc/postgresql/conf.d:ro
    # Setting di bawah ini TIDAK bisa ditimpa oleh conf.d (sengaja: keamanan)
    command:
      - postgres
      - -c
      - listen_addresses=*
      - -c
      - hba_file=/etc/postgresql/pg_hba.conf
      - -c
      - password_encryption=scram-sha-256
      - -c
      - ssl_min_protocol_version=TLSv1.2
      - -c
      - authentication_timeout=30s
      - -c
      - timezone=${TZ:-UTC}
      # Audit log: siapa connect dari IP mana, login gagal, perubahan skema
      - -c
      - log_connections=on
      - -c
      - log_disconnections=on
      - -c
      - log_statement=ddl
      - -c
      - "log_line_prefix=%m [%p] %q%u@%d from %h "
    # Hardening container
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  pgadmin:
    image: dpage/pgadmin4:${PGADMIN_VERSION:-latest}
    container_name: ${PGADMIN_CONTAINER_NAME:-pgadmin}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:?PGADMIN_DEFAULT_EMAIL wajib diisi di .env}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?PGADMIN_DEFAULT_PASSWORD wajib diisi di .env}
      # Port non-privileged supaya jalan dengan cap_drop: ALL
      PGADMIN_LISTEN_PORT: "8080"
      PGADMIN_DISABLE_POSTFIX: "true"
      PGADMIN_CONFIG_ENHANCED_COOKIE_PROTECTION: "True"
      PGADMIN_CONFIG_MAX_LOGIN_ATTEMPTS: ${PGADMIN_MAX_LOGIN_ATTEMPTS:-5}
      TZ: ${TZ:-UTC}
    ports:
      # Default 127.0.0.1: pgAdmin hanya HTTP, jangan dibuka publik tanpa reverse proxy HTTPS
      - "${PGADMIN_BIND_ADDRESS:-127.0.0.1}:${PGADMIN_PORT:-5050}:8080"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    configs:
      # Server PostgreSQL di atas otomatis terdaftar (hanya saat volume pgAdmin pertama dibuat)
      - source: pgadmin_servers
        target: /pgadmin4/servers.json
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/misc/ping"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

configs:
  pgadmin_servers:
    content: |
      {
        "Servers": {
          "1": {
            "Name": "${CONTAINER_NAME:-postgres18}",
            "Group": "Servers",
            "Host": "postgres",
            "Port": 5432,
            "MaintenanceDB": "${POSTGRES_DB:-postgres}",
            "Username": "${POSTGRES_USER}",
            "ConnectionParameters": { "sslmode": "require" }
          }
        }
      }

volumes:
  pgdata:
    name: ${CONTAINER_NAME:-postgres18}_data
  pgadmin_data:
    name: ${PGADMIN_CONTAINER_NAME:-pgadmin}_data
